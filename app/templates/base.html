<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}SalaryPro{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script> <!-- [web:41][web:45] -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    .card { @apply bg-white/80 backdrop-blur-xl rounded-3xl shadow-2xl p-8 border border-white/50; }
    .btn-primary { 
      @apply bg-gradient-to-r from-black to-slate-800 hover:from-gray-800 hover:to-slate-900 text-white px-6 py-3 rounded-2xl font-semibold flex items-center gap-2 justify-center shadow-xl hover:shadow-2xl transform hover:-translate-y-1 transition-all duration-200 whitespace-nowrap;
    }
    .input-field { 
      @apply border-2 border-slate-200 p-4 w-full rounded-2xl bg-white/50 backdrop-blur-sm focus:outline-none focus:ring-4 focus:ring-blue-200/50 focus:border-blue-400 transition-all duration-200 placeholder-slate-400;
    }
    .nav-link { 
      @apply px-4 py-3 rounded-2xl font-medium text-slate-700 hover:bg-slate-100 hover:text-slate-900 transition-all duration-200 flex items-center gap-2;
    }
    .nav-active {
      @apply bg-gradient-to-r from-blue-500 to-blue-600 text-white shadow-lg;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50 min-h-screen">

<!-- Enhanced NAVBAR -->
<nav class="backdrop-blur-xl bg-white/90 shadow-2xl border-b border-white/50 px-8 py-6">
  <div class="max-w-7xl mx-auto flex items-center justify-between">
    <a href="/" class="flex items-center gap-3 text-2xl font-bold bg-gradient-to-r from-gray-900 to-slate-700 bg-clip-text">
      <i class="fas fa-briefcase text-blue-600 text-3xl"></i>
      SalaryPro
    </a>

    <div class="flex items-center gap-6">
      <!-- Left nav links -->
      <div class="flex items-center gap-2">
        <a href="/" class="nav-link"><i class="fas fa-chart-line"></i> Dashboard</a>
        <a href="/employees" class="nav-link"><i class="fas fa-users"></i> Employees</a>
        <a href="/attendance/upload" class="nav-link"><i class="fas fa-file-excel"></i> Attendance</a>
        <a href="/salary/generate" class="nav-link"><i class="fas fa-calculator"></i> Salary</a>
        <a href="/penalties" class="nav-link"><i class="fas fa-exclamation-triangle"></i> Penalties</a>
      </div>

      <!-- Right side: Login / Logout -->
      <div class="flex items-center gap-3">
        <!-- Shown when NOT logged in -->
        <a id="login-link"
           href="/login"
           class="nav-link border border-slate-200">
          <i class="fas fa-sign-in-alt"></i>
          Login
        </a>

        <!-- Shown when logged in -->
        <div id="logout-wrapper" class="relative group hidden">
          <button
            id="logout-btn"
            class="inline-flex items-center gap-2 rounded-full border border-red-200/70 bg-red-50/70 px-4 py-2 text-sm font-medium text-red-700 shadow-sm hover:bg-red-500 hover:text-white hover:border-red-500 transition-all duration-200 hover:-translate-y-0.5"
          >
            <i class="fas fa-power-off text-xs"></i>
            <span>Logout</span>
          </button>
          <!-- Tooltip -->
          <div
            class="pointer-events-none absolute top-full right-0 mt-2 w-max rounded-xl bg-slate-900 text-[11px] text-slate-100 px-3 py-1.5 shadow-lg opacity-0 group-hover:opacity-100 translate-y-1 group-hover:translate-y-0 transition-all duration-150"
          >
            Sign out of SalaryPro
          </div>
        </div>
      </div>
    </div>
  </div>
</nav>

<main class="max-w-7xl mx-auto p-8">
  {% block content %}{% endblock %}
</main>

<script>
  const loginLink = document.getElementById('login-link');
  const logoutWrapper = document.getElementById('logout-wrapper');
  const logoutBtn = document.getElementById('logout-btn');

  // Simple auth detection via redirect (server-side session)
  fetch('/')
    .then(res => {
      if (res.redirected && res.url.includes('/login')) {
        loginLink?.classList.remove('hidden');
        logoutWrapper?.classList.add('hidden');
      } else {
        loginLink?.classList.add('hidden');
        logoutWrapper?.classList.remove('hidden');
      }
    })
    .catch(() => {
      // On error, default to showing login
      loginLink?.classList.remove('hidden');
      logoutWrapper?.classList.add('hidden');
    });

  logoutBtn?.addEventListener('click', () => {
    window.location.href = '/logout';
  });

  // Active nav link highlighting
  const path = window.location.pathname;
  document.querySelectorAll('.nav-link').forEach(link => {
    const href = link.getAttribute('href');
    if (!href) return;
    if (href === path || (href !== '/' && path.startsWith(href))) {
      link.classList.add('nav-active');
      link.classList.remove('text-slate-700', 'hover:text-slate-900');
    }
  });
</script>

</body>
</html>
