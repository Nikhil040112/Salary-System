{% extends "base.html" %}
{% block title %}Edit Employee - SalaryPro{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
  <div class="text-center mb-8">
    <div class="w-20 h-20 bg-gradient-to-r from-yellow-400 to-orange-500 rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-xl">
      <i class="fas fa-edit text-2xl text-white"></i>
    </div>
    <h1 class="text-3xl font-bold text-slate-900 mb-2">Edit Employee</h1>
  </div>

  <div class="card">
    <form method="post" class="space-y-6">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-3 flex items-center gap-2">
          <i class="fas fa-user text-green-500"></i>
          Employee Name
        </label>
        <input class="input-field" name="name" value="{{ employee.name }}" required>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-3 flex items-center gap-2">
            <i class="fas fa-rupee-sign text-emerald-500"></i>
            Monthly Salary
          </label>
          <input class="input-field" name="monthly_salary" type="number"
                 value="{{ employee.monthly_salary }}" required>
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-3 flex items-center gap-2">
            <i class="fas fa-calendar-day text-purple-500"></i>
            Cycle Start Day
          </label>
          <input class="input-field" name="salary_cycle_start_day" type="number"
                 value="{{ employee.salary_cycle_start_day }}" required>
        </div>
      </div>

      <div class="flex items-center gap-3 p-4 bg-slate-50 rounded-2xl">
        <div class="w-5 h-5 border-2 border-slate-300 rounded flex items-center justify-center flex-shrink-0">
          <input type="checkbox" name="is_active" value="1" id="active"
                 class="absolute opacity-0 w-5 h-5 cursor-pointer peer"
                 {% if employee.is_active %}checked{% endif %}>
          <i class="fas fa-check text-emerald-500 text-sm opacity-0 peer-checked:opacity-100 transition-all"></i>
        </div>
        <label for="active" class="text-sm font-semibold text-slate-700 cursor-pointer select-none flex-1">
          Active Employee
        </label>
        {% if employee.is_active %}
        <span class="px-3 py-1 bg-emerald-100 text-emerald-800 text-xs font-semibold rounded-full">Active</span>
        {% else %}
        <span class="px-3 py-1 bg-red-100 text-red-800 text-xs font-semibold rounded-full">Inactive</span>
        {% endif %}
      </div>

      <div class="flex gap-4 pt-2">
        <button class="btn-primary flex-1">
          <i class="fas fa-save"></i>
          Update Employee
        </button>
        <a href="/employees" class="flex-1 text-center py-3 px-6 border-2 border-slate-200 rounded-2xl font-semibold hover:bg-slate-50 hover:border-slate-300 transition-all flex items-center justify-center gap-2">
          <i class="fas fa-arrow-left"></i>
          Cancel
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
