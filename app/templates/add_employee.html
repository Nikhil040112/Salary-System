<!DOCTYPE html>
<html lang="en">
<head>
  <title>Add Employee - SalaryPro</title>
  <script src="https://cdn.tailwindcss.com"></script> <!-- Tailwind CSS CDN [web:1] -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"> <!-- Font Awesome [web:2] -->
</head>
<body class="bg-gradient-to-br from-slate-50 to-blue-50 min-h-screen p-8">
  <div class="max-w-md mx-auto">

    <!-- Back button -->
    <div class="mb-4">
      <a href="/employees"
         class="inline-flex items-center gap-2 text-sm font-semibold text-slate-600 hover:text-slate-900">
        <span class="inline-flex h-8 w-8 items-center justify-center rounded-full bg-white shadow">
          <i class="fas fa-arrow-left text-slate-700"></i>
        </span>
        <span>Back to Employees</span>
      </a>
    </div>

    <!-- Header -->
    <div class="text-center mb-8">
      <div class="w-20 h-20 bg-gradient-to-r from-blue-500 to-blue-600 rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-xl">
        <i class="fas fa-user-plus text-3xl text-white"></i>
      </div>
      <h1 class="text-3xl font-bold bg-gradient-to-r from-gray-900 to-slate-700 bg-clip-text text-transparent mb-2">
        Add New Employee
      </h1>
      <p class="text-slate-600">Enter employee details to get started</p>
    </div>

    <!-- Form Card -->
    <div class="bg-white/80 backdrop-blur-xl shadow-2xl rounded-3xl p-8 border border-white/50">
      <form method="post" class="space-y-6">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-3 flex items-center gap-2">
            <i class="fas fa-id-badge text-blue-500"></i>
            Employee Code
          </label>
          <input type="text" name="emp_code" placeholder="EMP001" required
                 class="input-field focus:ring-4 focus:ring-blue-200/50 w-full">
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-3 flex items-center gap-2">
            <i class="fas fa-user text-green-500"></i>
            Full Name
          </label>
          <input type="text" name="name" placeholder="John Doe" required
                 class="input-field focus:ring-4 focus:ring-green-200/50 w-full">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-3 flex items-center gap-2">
              <i class="fas fa-rupee-sign text-emerald-500"></i>
              Monthly Salary
            </label>
            <input type="number" name="monthly_salary" placeholder="50000" required
                   class="input-field focus:ring-4 focus:ring-emerald-200/50 w-full">
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-3 flex items-center gap-2">
              <i class="fas fa-calendar-day text-purple-500"></i>
              Cycle Start Day
            </label>
            <input type="number" name="salary_cycle_start_day" placeholder="1" min="1" max="30" required
                   class="input-field focus:ring-4 focus:ring-purple-200/50 w-full">
          </div>
        </div>

        <button type="submit"
                class="w-full bg-gradient-to-r from-black to-slate-800 hover:from-gray-800 hover:to-slate-900 text-white py-4 px-6 rounded-2xl font-semibold text-lg shadow-xl hover:shadow-2xl transform hover:-translate-y-1 transition-all duration-200 flex items-center justify-center gap-3">
          <i class="fas fa-save"></i>
          Save Employee
        </button>
      </form>
    </div>
  </div>
</body>
</html>
