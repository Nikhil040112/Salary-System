<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login • SalaryPro</title>
  <script src="https://cdn.tailwindcss.com"></script> <!-- [web:21][web:27] -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 flex items-center justify-center">

  <div class="absolute inset-0 bg-[radial-gradient(circle_at_top,_rgba(59,130,246,0.3),_transparent_60%),_radial-gradient(circle_at_bottom,_rgba(56,189,248,0.25),_transparent_55%)] pointer-events-none"></div> <!-- soft glow [web:27][web:30] -->

  <div class="relative z-10 w-full max-w-md px-4">
    <div class="bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl shadow-2xl p-8">

      <!-- Logo + title -->
      <div class="flex items-center gap-3 mb-6">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white shadow-lg">
          <i class="fas fa-briefcase"></i>
        </div>
        <div>
          <h1 class="text-xl font-semibold text-white">SalaryPro</h1>
          <p class="text-sm text-slate-200/80">Admin login</p>
        </div>
      </div>

      {% if error %}
        <div class="mb-4 rounded-2xl bg-red-500/10 border border-red-400/60 px-4 py-3 text-sm text-red-100">
          {{ error }}
        </div>
      {% endif %}

      <form method="post" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-slate-100 mb-2">
            Username
          </label>
          <div class="flex items-center gap-2 bg-white/5 border border-white/20 rounded-2xl px-3 py-2 focus-within:border-blue-400 focus-within:ring-2 focus-within:ring-blue-500/40">
            <i class="fas fa-user text-slate-300 text-sm"></i>
            <input
              name="username"
              placeholder="Enter username"
              required
              class="w-full bg-transparent outline-none text-slate-100 placeholder-slate-400 text-sm"
            />
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-100 mb-2">
            Password
          </label>
          <div class="flex items-center gap-2 bg-white/5 border border-white/20 rounded-2xl px-3 py-2 focus-within:border-blue-400 focus-within:ring-2 focus-within:ring-blue-500/40">
            <i class="fas fa-lock text-slate-300 text-sm"></i>
            <input
              type="password"
              name="password"
              placeholder="Enter password"
              required
              class="w-full bg-transparent outline-none text-slate-100 placeholder-slate-400 text-sm"
            />
          </div>
        </div>

        <div class="flex items-center justify-between text-xs text-slate-300 mt-1">
          <div class="flex items-center gap-2">
            <input id="remember" type="checkbox"
                   class="w-3 h-3 rounded border-slate-500 bg-transparent text-blue-500 focus:ring-blue-400/60">
            <label for="remember">Stay signed in on this device</label>
          </div>
        </div>

        <button
          type="submit"
          class="w-full mt-2 bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white font-medium py-2.5 rounded-2xl shadow-lg shadow-blue-500/30 flex items-center justify-center gap-2 text-sm transition-all duration-200 hover:-translate-y-0.5"
        >
          <i class="fas fa-sign-in-alt text-xs"></i>
          Sign in
        </button>
      </form>
    </div>
  </div>
</body>
</html>
